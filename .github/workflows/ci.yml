name: CI

on:
  pull_request:
  push:
    branches: [main]

# Sem filtro `paths:` enquanto estes jobs forem checks obrigatórios: check que
# não roda fica pending para sempre e trava o merge.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    # working-directory por job, não global: o pr-title não faz checkout e
    # falharia tentando entrar num diretório que não existe.
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # The storage tests run against the database the application actually uses.
    # Passing on SQLite would prove the tests pass, not that the schema works.
    # The suite creates its own database on this server and builds the schema
    # with `alembic upgrade head`, so every run exercises the migrations (#43).
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: firenze
          POSTGRES_PASSWORD: firenze
          POSTGRES_DB: firenze
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U firenze"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FIRENZE_TEST_DATABASE_URL: postgresql+psycopg://firenze:firenze@localhost:5432/firenze
      FIRENZE_DATABASE_URL: postgresql+psycopg://firenze:firenze@localhost:5432/firenze
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - name: migrations apply cleanly from scratch
        run: uv run alembic upgrade head
      - run: uv run pytest
      - name: contrato commitado está atualizado
        run: |
          uv run python scripts/dump_openapi.py
          git diff --exit-code openapi.json \
            || { echo "::error::openapi.json desatualizado — rode 'make openapi' e commite"; exit 1; }

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: apps/web/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn build
      # Os tipos do front sao gerados do openapi.json, nunca escritos a mao.
      # Se o contrato mudou e ninguem regerou, o front acredita numa API que
      # nao existe mais — e o tsc passa, porque ele confia no arquivo antigo.
      - name: tipos do front batem com o contrato
        run: |
          yarn contracts
          git diff --exit-code src/lib/contracts.ts             || { echo "::error::contracts.ts desatualizado — rode 'make contracts' e commite"; exit 1; }

  compose:
    runs-on: ubuntu-latest
    # A pilha do compose passou meses respondendo /health e morrendo no
    # primeiro turno: nome de modulo antigo no CMD, prompts fora da imagem,
    # nenhum provedor de modelo, nenhuma migration. Nada disso aparece em
    # teste unitario, porque nada disso e codigo — e a unica forma de nao
    # apodrecer de novo e jogar um turno de verdade a cada PR.
    steps:
      - uses: actions/checkout@v4
      - name: sobe a pilha como um clone novo
        run: docker compose -f infra/compose/docker-compose.yml up -d --build
      - name: espera a API responder
        run: |
          for _ in $(seq 1 60); do
            curl -sf localhost:8000/health && exit 0
            sleep 2
          done
          docker compose -f infra/compose/docker-compose.yml logs api
          echo "::error::a API nao subiu"; exit 1
      - name: uma partida inteira, sem chave nenhuma
        run: |
          set -euo pipefail
          id=$(curl -sf -X POST localhost:8000/matches                  -H 'content-type: application/json'                  -d '{"seed":42,"locale":"pt-BR"}' | jq -r .id)
          turn=$(curl -sf -X POST "localhost:8000/matches/$id/turns"                    -H 'content-type: application/json'                    -d '{"suspect":"sus-1","question":"onde estava as 22h?"}')
          echo "$turn" | jq -e '.answered == true' > /dev/null             || { echo "::error::o suspeito nao respondeu: $turn"; exit 1; }
          curl -sf -X POST "localhost:8000/matches/$id/accusation"             -H 'content-type: application/json' -d '{"culprit":"sus-1"}'             | jq -e 'has("score")' > /dev/null
      - name: logs quando quebra
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml logs

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: título no formato conventional
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          padrao='^(feat|fix|docs|chore|refactor|test|perf|build|ci|revert)(\([a-z0-9 -]+\))?!?: .+'
          if ! printf '%s' "$TITULO" | grep -qE "$padrao"; then
            echo "::error::título do PR fora do padrão: $TITULO"
            echo "O merge é squash: este título vira a mensagem na main e alimenta o CHANGELOG."
            exit 1
          fi
